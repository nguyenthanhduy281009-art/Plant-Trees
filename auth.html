<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực - PLANTREES</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #2e7d32; } 
        body { font-family: sans-serif; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #222; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 320px; text-align: center; color: white; }
        .brand-name { font-size: 32px; font-weight: 900; margin-bottom: 5px; background: linear-gradient(45deg, #2e7d32, #66bb6a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        #title { margin-top: 0; margin-bottom: 20px; font-size: 16px; color: #bbb; }
        .input-group { position: relative; margin: 8px 0; }
        input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; outline: none; background: #000; color: #fff; margin-bottom: 8px; }
        .show-btn { position: absolute; right: 10px; top: 10px; background: #333; border: none; padding: 5px; border-radius: 4px; font-size: 10px; cursor: pointer; color: #fff; }
        button.main { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button.main:hover { background: #388e3c; }
        .link { margin-top: 15px; font-size: 13px; color: #66bb6a; cursor: pointer; }
        .forgot { display: block; text-align: right; font-size: 12px; color: #888; margin-bottom: 10px; text-decoration: none; cursor: pointer; }
        #error { color: #ff4d4d; font-size: 12px; margin-top: 10px; min-height: 15px; }
    </style>
</head>
<body>
<div class="box">
    <div class="brand-name">PLANTREES</div>
    <h2 id="title">ĐĂNG NHẬP</h2>
    
    <input type="text" id="username" placeholder="Tên người làm vườn (Duy nhất)" style="display: none;">
    <input type="email" id="email" placeholder="Email của bạn">
    
    <div class="input-group">
        <input type="password" id="pass" placeholder="Mật khẩu">
        <button class="show-btn" onclick="togglePass(event)">HIỆN</button>
    </div>

    <a class="forgot" id="forgotBtn" onclick="forgotPass()">Quên mật khẩu?</a>

    <button class="main" onclick="handleAuth()" id="btnSubmit">ĐĂNG NHẬP</button>
    
    <div id="error"></div>
    
    <div class="link" onclick="switchMode()" id="toggleTxt">Chưa có tài khoản? Đăng ký ngay</div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAASOFywyAkx2G7ubR_XsODI1U2x7mSMpE",
    authDomain: "plantrees-b1d99.firebaseapp.com",
    databaseURL: "https://plantrees-b1d99-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "plantrees-b1d99",
    storageBucket: "plantrees-b1d99.firebasestorage.app",
    messagingSenderId: "208821406000",
    appId: "1:208821406000:web:b4fac89c9a2f65d739e0f5"
};
    
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let isLogin = true;

function togglePass(event) {
    const p = document.getElementById("pass");
    p.type = p.type === "password" ? "text" : "password";
    event.target.innerText = p.type === "password" ? "HIỆN" : "ẨN";
}

function switchMode() {
    isLogin = !isLogin;
    document.getElementById("title").innerText = isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ";
    document.getElementById("btnSubmit").innerText = isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ";
    document.getElementById("toggleTxt").innerText = isLogin ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
    document.getElementById("username").style.display = isLogin ? "none" : "block";
    document.getElementById("forgotBtn").style.display = isLogin ? "block" : "none";
    document.getElementById("error").innerText = "";
}

async function forgotPass() {
    const email = document.getElementById("email").value.trim();
    if (!email) return alert("Vui lòng nhập Email!");
    try {
        await auth.sendPasswordResetEmail(email);
        alert("Link đặt lại mật khẩu đã được gửi vào Email!");
    } catch (e) { alert("Lỗi: " + e.message); }
}

async function handleAuth() {
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("pass");
    const nickname = document.getElementById("username").value.trim();
    const err = document.getElementById("error");
    
    if(!email || !pass.value || (!isLogin && !nickname)) return err.innerText = "Điền đầy đủ thông tin!";
    err.innerText = "Đang xử lý...";

    try {
        if (isLogin) {
            // Logic Đăng nhập
            await auth.signInWithEmailAndPassword(email, pass.value);
            window.location.href = "index.html";
        } else {
            // Logic Đăng ký
            if (nickname.length < 3) return err.innerText = "Tên ít nhất 3 ký tự!";

            // BƯỚC CẢI TIẾN: Kiểm tra trùng tên TRƯỚC khi tạo user auth
            const nameCheck = await db.ref('users').orderByChild('name').equalTo(nickname).once('value');
            if (nameCheck.exists()) {
                return err.innerText = "Tên người làm vườn này đã có người dùng!";
            }

            // Tiến hành tạo tài khoản sau khi kiểm tra hợp lệ
            const res = await auth.createUserWithEmailAndPassword(email, pass.value);
            await res.user.updateProfile({ displayName: nickname });
            
            // Khởi tạo data chuẩn 3 bình nước + kích hoạt thời gian Server chạy chuẩn xác
            await db.ref('users/' + res.user.uid).set({
                name: nickname,
                email: email,
                avatarUrl: "https://cdn-icons-png.flaticon.com/512/4333/4333609.png",
                coins: 0,
                
                // Cấu hình nước của người chơi mới
                currentWater: 3, 
                maxWater: 3,     
                
                // Các chỉ số nâng cấp cơ bản
                regenSpeed: 3600,
                speedLevel: 1,
                storageLevel: 1,
                waterLevel: 0,
                
                // Khởi tạo mốc thời gian bằng TIMESTAMP Server để đồng hồ chạy lập tức khi vào game
                lastRegenTime: firebase.database.ServerValue.TIMESTAMP,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            });

            alert("Chào mừng người làm vườn " + nickname + "!");
            window.location.href = "index.html";
        }
    } catch (e) { 
        err.innerText = e.message; 
    }
}
</script>
</body>
</html>
