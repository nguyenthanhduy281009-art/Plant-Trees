<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantrees - Vườn Cây Chung</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        :root { 
    --bg: #ffffff; /* Đổi thành màu trắng */
    --primary: #2e7d32; 
}

body { 
    font-family: 'Segoe UI', sans-serif; 
    margin: 0; 
    background: var(--bg); 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
    overflow: hidden;
    
    /* KHÓA CHẠM VÀ COPY */
    user-select: none; /* Không cho bôi đen/copy chữ */
    -webkit-user-select: none;
    -webkit-touch-callout: none; /* Khóa menu chuột phải khi nhấn giữ trên điện thoại */
    touch-action: manipulation; /* Ngăn zoom khi nhấn liên tiếp */
}

/* KHÓA TƯƠNG TÁC VỚI ẢNH */
img {
    -webkit-user-drag: none; /* Không cho kéo ảnh */
    pointer-events: none;    /* Ảnh chỉ để nhìn, không thể nhấn vào */
}

/* RIÊNG CÁC NÚT BẤM THÌ PHẢI CHO NHẤN */
button, .up-card, .nav-link {
    pointer-events: auto; 
    cursor: pointer;
}

        .main-garden { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 80px; }
        .total-number { font-size: 32px; font-family: 'Luckiest Guy'; color: var(--primary); margin: 0; }

        #tree-display { height: 220px; display: flex; align-items: center; justify-content: center; margin: 10px 0; }
        #tree-display img { width: 200px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1)); transition: 0.2s; }

        .action-cluster { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
        .pour-btn { width: 240px; height: 65px; border: none; border-radius: 20px; background: #0288d1; color: white; font-size: 24px; font-family: 'Luckiest Guy'; cursor: pointer; box-shadow: 0 5px 0 #01579b; }
        .pour-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #01579b; }
        .pour-btn:disabled { background: #ccc; box-shadow: 0 5px 0 #999; cursor: not-allowed; }

        .upgrade-row { display: flex; gap: 8px; }
        .up-card { background: white; padding: 8px 12px; border-radius: 12px; border: 1px solid #ddd; cursor: pointer; font-size: 10px; font-weight: bold; text-align: center; min-width: 80px; }

        .footer-nav { width: 100%; display: flex; justify-content: space-around; align-items: center; background: #ffffff; border-top: 2px solid #f0f0f0; position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 0 25px 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 999; }
        .nav-link { text-align: center; text-decoration: none; color: #b0b0b0; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: all 0.3s ease; }
        .nav-link i { font-size: 22px; }
        .nav-link span { font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .nav-link.active { color: #2e7d32; transform: translateY(-3px); }
        .watering-anim {
    position: absolute;
    font-size: 45px;
    top: -20px;
    right: -20px;
    opacity: 0;
    transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    z-index: 10;
}
.watering-anim.active {
    opacity: 1;
    transform: translate(-60px, 40px) rotate(-40deg);
}
#tree-container { position: relative; }
    </style>
</head>
<body>

<div class="header">
    <div class="user-info-box">
        <img id="u-avatar" src="https://cdn-icons-png.flaticon.com/512/4333/4333609.png" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover;">
        <div class="stats-group">
            <div id="u-name" style="color: #333; font-weight: bold; font-size: 13px;">Đang tải...</div>
            <div style="display: flex; gap: 10px;">
                <div class="stat-item" style="color: #f3ba2f;"><span id="u-coins">0</span> <img src="https://drive.google.com/thumbnail?id=13GfXHlWxw_dlc3eWxlO4p5D5HY1n361H&sz=w100" class="coin-img"></div>
                <div class="stat-item" style="color: #0288d1;"><span id="cur-water">0</span>/<span id="max-water">3</span> <i class="fas fa-tint"></i></div>
            </div>
        </div>
    </div>
    <button onclick="auth.signOut()" style="border:none; background:none; color:#999; font-weight:bold; cursor:pointer;">Thoát</button>
</div>

<div class="main-garden">
    <div id="tree-container" style="text-align: center; margin-top: 20px;">
        <div id="tree-display" style="font-size: 80px; min-height: 220px; transition: transform 0.2s; display: flex; align-items: center; justify-content: center;">
            </div>
        
        <div id="growth-info" style="margin-top: 10px;">
            <div id="stage-name" style="font-size: 14px; font-weight: bold; color: #2e7d32; margin-bottom: 5px;">Đang tải...</div>
            
            <div style="width: 200px; height: 15px; background: #e0e0e0; border-radius: 10px; margin: auto; overflow: hidden; border: 1px solid #ccc;">
                <div id="progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a); transition: width 0.5s;"></div>
            </div>
            
            <div id="water-ratio" style="font-size: 12px; margin-top: 5px; color: #666; font-weight: bold;">0/0</div>
        </div>
    </div>

    <div id="regen-text" style="font-size: 11px; color: #999; margin-top: 15px; margin-bottom: 10px;">--:--</div>
    
    <div class="action-cluster">
        <button class="pour-btn" id="btnPour" onclick="pourWater()">TƯỚI NƯỚC 💧</button>
        <div class="upgrade-row">
    <div class="up-card" onclick="upgrade('speed')">
        ⚡ HỒI NHANH (Lv<span id="speed-lv">1</span>)<br>
        <span style="color: #f3ba2f;"><span id="speed-cost">50</span> <img src="https://drive.google.com/thumbnail?id=13GfXHlWxw_dlc3eWxlO4p5D5HY1n361H&sz=w100" width="10"></span>
    </div>
    <div class="up-card" onclick="upgrade('storage')">
        📦 THÊM BÌNH (Lv<span id="storage-lv">1</span>)<br>
        <span style="color: #f3ba2f;"><span id="storage-cost">100</span> <img src="https://drive.google.com/thumbnail?id=13GfXHlWxw_dlc3eWxlO4p5D5HY1n361H&sz=w100" width="10"></span>
    </div>
</div>

<div class="footer-nav">
    <a href="collection.html" class="nav-link"><i class="fas fa-seedling"></i><span>Khu Vườn</span></a>
    <a href="tasks.html" class="nav-link"><i class="fas fa-tasks"></i><span>Nhiệm Vụ</span></a>
    <a href="leaderboard.html" class="nav-link"><i class="fas fa-trophy"></i><span>Xếp Hạng</span></a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAASOFywyAkx2G7ubR_XsODI1U2x7mSMpE",
        authDomain: "plantrees-b1d99.firebaseapp.com",
        databaseURL: "https://plantrees-b1d99-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "plantrees-b1d99",
        storageBucket: "plantrees-b1d99.firebasestorage.app",
        messagingSenderId: "208821406000",
        appId: "1:208821406000:web:b4fac89c9a2f65d739e0f5"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let userData = {};
    let regenInterval;
    let plantSettings = [];

    auth.onAuthStateChanged(user => {
        if (user) {
            listenToUser(user.uid);
            loadPlantSettings();
        } else { window.location.href = "auth.html"; }
    });

    function getDirectLink(url) {
    if (url && url.includes('drive.google.com')) {
        const parts = url.split('/d/');
        if (parts.length > 1) {
            const id = parts[1].split('/')[0];
            return `https://lh3.googleusercontent.com/d/${id}`;
        }
    }
    return url;
}
    
    function loadPlantSettings() {
        db.ref('settings/plants').on('value', s => {
            plantSettings = [];
            s.forEach(c => plantSettings.push(c.val()));
            plantSettings.sort((a,b) => a.required_water - b.required_water);
        });
    }

    function listenToUser(uid) {
    db.ref('users/' + uid).on('value', s => {
        userData = s.val() || {};
        const curW = userData.currentWater !== undefined ? userData.currentWater : 0;
        const maxW = userData.maxWater || 3;
        const speed = userData.regenSpeed || 3600;

        // Cấp độ hiện tại (mặc định là 1)
        const sLv = userData.speedLevel || 1;
        const stLv = userData.storageLevel || 1;

        // Hiển thị thông tin cơ bản
        document.getElementById('u-name').innerText = userData.name || "Người làm vườn";
        document.getElementById('u-coins').innerText = (userData.coins || 0).toLocaleString();
        document.getElementById('cur-water').innerText = curW;
        document.getElementById('max-water').innerText = maxW;
        if(userData.avatarUrl) document.getElementById('u-avatar').src = userData.avatarUrl;
        
        // Cập nhật Level lên giao diện
        document.getElementById('speed-lv').innerText = sLv;
        document.getElementById('storage-lv').innerText = stLv;

        // Cập nhật Giá tiền nâng cấp tiếp theo lên giao diện
        // Hồi nhanh: 50, 75, 100...
        document.getElementById('speed-cost').innerText = 50 + (sLv - 1) * 25;
        // Thêm bình: 100, 150, 200...
        document.getElementById('storage-cost').innerText = 100 + (stLv - 1) * 50;

        // Mở/Khóa nút tưới
        document.getElementById('btnPour').disabled = (curW <= 0);
        
        startRegenLogic(uid, curW, maxW, speed);
    });
}

    let allPlants = [];

// 1. Lấy danh sách cây từ Admin Duy đã nhập
db.ref('settings/plants_v2').on('value', (snapshot) => {
    if (!snapshot.exists()) return;
    allPlants = [];
    snapshot.forEach(child => {
        allPlants.push(child.val());
    });
    // Lấy lại dữ liệu nước để vẽ lại ngay khi admin đổi cây
    db.ref('global/totalWater').once('value', (snap) => {
        renderPlant(snap.val() || 0);
    });
});

// 2. Theo dõi tổng số nước của Thế giới
db.ref('global/totalWater').on('value', (snapshot) => {
    const totalGlobalWater = snapshot.val() || 0;
    renderPlant(totalGlobalWater);
});

function renderPlant(totalGlobal) {
    if (allPlants.length === 0) return;

    let waterPool = totalGlobal;
    let currentPlant = null;
    let currentStage = null;
    let stageRequired = 0;
    let stageCurrent = 0;
    let currentStageIndex = 0;

    // Logic tính toán cây và giai đoạn hiện tại
    for (let i = 0; i < allPlants.length; i++) {
        let plant = allPlants[i];
        let plantTotalWater = plant.stages.reduce((sum, st) => sum + st.required_water, 0);

        if (waterPool < plantTotalWater || i === allPlants.length - 1) {
            currentPlant = plant;
            for (let j = 0; j < plant.stages.length; j++) {
                let st = plant.stages[j];
                if (waterPool < st.required_water || j === plant.stages.length - 1) {
                    currentStage = st;
                    stageRequired = st.required_water;
                    stageCurrent = waterPool;
                    currentStageIndex = j;
                    break;
                } else {
                    waterPool -= st.required_water;
                }
            }
            break;
        } else {
            waterPool -= plantTotalWater;
        }
    }

    // Hiển thị lên màn hình
    if (currentPlant && currentStage) {
        const display = document.getElementById('tree-display');
        const totalStages = currentPlant.stages.length;
        
        // Tỉ lệ scale: Giai đoạn 1 là 60%, to dần đến 100% ở giai đoạn cuối
        const scaleValue = 0.6 + (currentStageIndex / (totalStages - 1 || 1)) * 0.4;
        const imgUrl = getDirectLink(currentStage.image);

        if (imgUrl.includes('http')) {
            display.innerHTML = `
                <img src="${imgUrl}" 
                     style="height: 220px; 
                            transform: scale(${scaleValue}); 
                            transform-origin: bottom; 
                            transition: all 0.5s ease-out; 
                            object-fit: contain;"
                     onerror="this.src='https://cdn-icons-png.flaticon.com/512/628/628283.png'">`;
        } else {
            display.innerHTML = `
                <div style="font-size: ${100 * scaleValue}px; transform-origin: bottom;">
                    ${currentStage.image}
                </div>`;
        }

        document.getElementById('stage-name').innerText = currentPlant.name;
        const percent = Math.min((stageCurrent / stageRequired) * 100, 100);
        document.getElementById('progress-bar').style.width = percent + "%";
        document.getElementById('water-ratio').innerText = `${stageCurrent} / ${stageRequired}`;
    }
}
    // 3. Hiển thị lên màn hình (Khớp với cái HTML Tree-container của Duy)
    if (currentPlant && currentStage) {
        const display = document.getElementById('tree-display');
        if (currentStage.image.includes('http')) {
            display.innerHTML = `<img src="${currentStage.image}" style="height:200px; object-fit:contain;">`;
        } else {
            display.innerText = currentStage.image;
        }

        document.getElementById('stage-name').innerText = currentPlant.name;
        const percent = Math.min((stageCurrent / stageRequired) * 100, 100);
        document.getElementById('progress-bar').style.width = percent + "%";
        document.getElementById('water-ratio').innerText = `${stageCurrent} / ${stageRequired}`;
    }

    function startRegenLogic(uid, curW, maxW, speed) {
        if (regenInterval) clearInterval(regenInterval);
        regenInterval = setInterval(() => {
            const now = Date.now();
            const lastUpdate = userData.lastRegenTime || now;
            const elapsed = Math.floor((now - lastUpdate) / 1000);
            if (curW < maxW) {
                if (elapsed >= speed) {
                    db.ref('users/' + uid).update({ currentWater: Math.min(maxW, curW + 1), lastRegenTime: now });
                }
                const remaining = speed - (elapsed % speed);
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                document.getElementById('regen-text').innerText = `Hồi nước sau: ${m}:${s < 10 ? '0'+s : s}`;
            } else { document.getElementById('regen-text').innerText = "Bình nước đã đầy ✨"; }
        }, 1000);
    }

   async function pourWater() {
    const uid = auth.currentUser.uid;
    const btn = document.getElementById('btnPour');
    const container = document.getElementById('tree-container');
    
    // 1. Kiểm tra nước
    if (!userData || userData.currentWater === undefined || userData.currentWater <= 0) {
        btn.disabled = true;
        return;
    }

    btn.disabled = true; // Khóa nút ngay lập tức

    // 2. Tạo bình nước ảo
    const can = document.createElement('div');
    can.className = 'watering-anim';
    can.innerHTML = '🚿'; // Duy có thể đổi thành 🏺 hoặc 💧 tùy ý
    container.appendChild(can);

    // Bắt đầu diễn hoạt bình nước bay vào
    setTimeout(() => can.classList.add('active'), 50);

    // 3. Đợi diễn hoạt xong (800ms) rồi mới cập nhật dữ liệu
    setTimeout(async () => {
        try {
            const updates = {};
            updates['global/totalWater'] = firebase.database.ServerValue.increment(1);
            updates[`users/${uid}/currentWater`] = firebase.database.ServerValue.increment(-1);
            updates[`users/${uid}/waterLevel`] = firebase.database.ServerValue.increment(1);

            if (userData.currentWater === userData.maxWater) {
                updates[`users/${uid}/lastRegenTime`] = Date.now();
            }

            await db.ref().update(updates);
            
            // Hiệu ứng rung cây (áp dụng cho cả ảnh và emoji)
            const treeDisplay = document.getElementById('tree-display');
            if(treeDisplay) {
                treeDisplay.style.transform = "scale(1.1) rotate(5deg)";
                setTimeout(() => treeDisplay.style.transform = "scale(1) rotate(0deg)", 200);
            }

        } catch(e) {
            console.error("Lỗi tưới nước:", e);
        } finally {
            // 4. Thu hồi bình nước và mở lại nút nếu còn nước
            can.classList.remove('active');
            setTimeout(() => {
                can.remove();
                // Chỉ mở lại nút nếu người dùng vẫn còn nước để tưới tiếp
                if (userData.currentWater > 0) {
                    btn.disabled = false;
                }
            }, 400);
        }
    }, 800); // Tổng thời gian chờ tưới là 0.8 giây
}

    async function upgrade(type) {
    const uid = auth.currentUser.uid;
    const speedLv = userData.speedLevel || 1;
    const storageLv = userData.storageLevel || 1;
    const currentCoins = userData.coins || 0;
    
    let cost = 0;
    let updates = {};

    if (type === 'speed') {
        cost = 50 + (speedLv - 1) * 25;
        const currentRegen = userData.regenSpeed || 3600;

        if (currentRegen <= 50) return alert("Tốc độ hồi nước đã đạt tối đa!");
        if (currentCoins < cost) return alert(`Bạn cần ${cost} xu để nâng cấp!`);

        updates['speedLevel'] = speedLv + 1;
        // Giảm 50 giây cho mỗi cấp, không thấp hơn 50 giây
        updates['regenSpeed'] = Math.max(50, currentRegen - 50);
    } 
    else if (type === 'storage') {
        cost = 100 + (storageLv - 1) * 50;
        if (currentCoins < cost) return alert(`Bạn cần ${cost} xu để nâng cấp!`);

        updates['storageLevel'] = storageLv + 1;
        updates['maxWater'] = (userData.maxWater || 3) + 1;
    }

    // Trừ tiền
    updates['coins'] = currentCoins - cost;

    try {
        // Cập nhật thẳng vào node của user
        await db.ref('users/' + uid).update(updates);
        // Lưu ý: alert nên để sau khi update thành công
        console.log("Nâng cấp thành công!"); 
    } catch(e) {
        console.error(e);
        alert("Lỗi hệ thống!");
    }
}
</script>
</body>
</html>
