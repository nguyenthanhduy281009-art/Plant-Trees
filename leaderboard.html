<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantrees - Bảng Xếp Hạng</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2e7d32; --bg: #f1f8e9; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            color: #333; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        .container { 
            width: 100%;
            max-width: 500px; 
            background: white; 
            padding: 20px; 
            border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 2px solid #e0e0e0;
        }

        h1 { 
            font-family: 'Luckiest Guy'; 
            color: var(--primary); 
            margin: 10px 0 20px 0; 
            font-size: 28px; 
            text-transform: uppercase;
            text-align: center;
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { color: #888; font-size: 12px; text-transform: uppercase; padding-bottom: 10px; }
        
        tr.rank-row { background: #f9fdf9; }
        td { padding: 12px; font-weight: 600; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
        td:first-child { border-left: 1px solid #eee; border-radius: 12px 0 0 12px; width: 50px; text-align: center; }
        td:last-child { border-right: 1px solid #eee; border-radius: 0 12px 12px 0; text-align: center; }

        .rank-1 { color: #FFD700; font-size: 22px; }
        .rank-2 { color: #C0C0C0; font-size: 18px; }
        .rank-3 { color: #CD7F32; font-size: 18px; }

        .user-cell { display: flex; align-items: center; gap: 10px; text-align: left; }
        .avatar-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #eee; }

        .back-btn { 
            margin-top: 30px; 
            padding: 15px 40px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-family: 'Luckiest Guy';
            font-size: 18px;
            box-shadow: 0 5px 0 #1b5e20;
            transition: 0.2s;
            width: 100%;
            max-width: 300px;
        }
        .back-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1b5e20; }
    </style>
</head>
<body>

<div class="container">
    <h1>TOP CHIẾN BINH</h1>
    <table>
        <thead>
            <tr>
                <th>Hạng</th>
                <th style="text-align: left;">Người chơi</th>
                <th>Tưới</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <tr><td colspan="3" style="text-align: center; color: #999;">Đang tải dữ liệu...</td></tr>
        </tbody>
    </table>
</div>

<button class="back-btn" onclick="location.href='garden.html'">
    <i class="fas fa-arrow-left"></i> QUAY LẠI KHU VƯỜN
</button>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAASOFywyAkx2G7ubR_XsODI1U2x7mSMpE",
        authDomain: "plantrees-b1d99.firebaseapp.com",
        databaseURL: "https://plantrees-b1d99-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "plantrees-b1d99",
        storageBucket: "plantrees-b1d99.firebasestorage.app",
        messagingSenderId: "208821406000",
        appId: "1:208821406000:web:b4fac89c9a2f65d739e0f5"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Load dữ liệu thực tế từ database
    db.ref('users').orderByChild('waterLevel').limitToLast(10).on('value', (snapshot) => {
        let list = [];
        snapshot.forEach(child => {
            list.push(child.val());
        });
        list.reverse();

        let html = '';
        if (list.length === 0) {
            html = '<tr><td colspan="3" style="text-align: center;">Chưa có cao thủ nào</td></tr>';
        } else {
            list.forEach((user, index) => {
                let rank = index + 1;
                let rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
                let rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
                let avatar = user.avatarUrl || 'https://cdn-icons-png.flaticon.com/512/4333/4333609.png';

                html += `
                <tr class="rank-row">
                    <td class="${rankClass}">${rankIcon}</td>
                    <td>
                        <div class="user-cell">
                            <img src="${avatar}" class="avatar-img">
                            <span>${user.name || "Ẩn danh"}</span>
                        </div>
                    </td>
                    <td style="color: #0288d1;">${user.waterLevel || 0}</td>
                </tr>`;
            });
        }
        document.getElementById('leaderboard-body').innerHTML = html;
    });
</script>

</body>
</html>
