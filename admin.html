<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Cấu Hình Cây Trồng</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eceff1; padding: 20px; color: #37474f; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2e7d32; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #cfd8dc; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .btn-next { background: #2e7d32; color: white; }
        .btn-finish { background: #0288d1; color: white; }
        .btn-next:hover { background: #1b5e20; }
        
        /* Bảng danh sách cây */
        .total-list { margin-top: 40px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #f8f9fa; color: #2e7d32; }
        .img-preview { width: 30px; height: 30px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container" id="admin-app">
    <h2>🍀 CẤU HÌNH CÂY MỚI</h2>

    <div id="step-1">
        <div class="form-group">
            <label>Tên loại cây:</label>
            <input type="text" id="p-name" placeholder="Ví dụ: Cây Sầu Riêng">
        </div>
        <div class="form-group">
            <label>Cây này có bao nhiêu giai đoạn (Level)?</label>
            <input type="number" id="p-stages-count" placeholder="Nhập số lượng giai đoạn...">
        </div>
        <button class="btn btn-next" onclick="startInputStages()">BẮT ĐẦU NHẬP CHI TIẾT</button>
    </div>

    <div id="step-2" style="display: none;">
        <h3 id="current-stage-title" style="color: #0288d1;">Nhập Giai Đoạn 1</h3>
        <div class="form-group">
            <label>Link ảnh hoặc Emoji:</label>
            <input type="text" id="s-img" placeholder="Dán link ảnh hoặc 🌱">
        </div>
        <div class="form-group">
            <label>Số giọt nước cần để đạt cấp này:</label>
            <input type="number" id="s-water" placeholder="Ví dụ: 100">
        </div>
        <button id="btn-action" class="btn btn-next" onclick="nextStage()">TIẾP TỤC</button>
    </div>
</div>

<div class="container total-list">
    <h3 style="margin-top: 0;">📋 CHI TIẾT DANH SÁCH CÂY ĐÃ LÊN</h3>
    <table id="all-plants-table">
        <thead>
            <tr>
                <th>Tên cây</th>
                <th>Số GĐ</th>
                <th>Giai đoạn cuối</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAASOFywyAkx2G7ubR_XsODI1U2x7mSMpE",
        authDomain: "plantrees-b1d99.firebaseapp.com",
        databaseURL: "https://plantrees-b1d99-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "plantrees-b1d99",
        storageBucket: "plantrees-b1d99.firebasestorage.app",
        messagingSenderId: "208821406000",
        appId: "1:208821406000:web:b4fac89c9a2f65d739e0f5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let tempName = "";
    let totalStages = 0;
    let currentStageIndex = 1;
    let gatheredStages = [];

    // Dán hàm này vào đoạn đầu script nhé Duy
    function getDirectLink(url) {
        if (url && url.includes('drive.google.com')) {
            const parts = url.split('/d/');
            if (parts.length > 1) {
                const id = parts[1].split('/')[0];
                return `https://drive.google.com/uc?export=view&id=${id}`;
            }
        }
        return url;
    }

    // Bước 1 -> Bước 2
    function startInputStages() {
        tempName = document.getElementById('p-name').value;
        totalStages = parseInt(document.getElementById('p-stages-count').value);

        if(!tempName || isNaN(totalStages) || totalStages <= 0) {
            return alert("Duy vui lòng nhập đủ tên và số giai đoạn!");
        }

        document.getElementById('step-1').style.display = 'none';
        document.getElementById('step-2').style.display = 'block';
        updateStageUI();
    }

    // Xử lý chuyển giai đoạn
    function nextStage() {
        const img = document.getElementById('s-img').value;
        const water = document.getElementById('s-water').value;

        if(!img || !water) return alert("Nhập đủ thông tin giai đoạn này đã Duy ơi!");

        gatheredStages.push({ image: img, required_water: parseInt(water) });

        if(currentStageIndex < totalStages) {
            currentStageIndex++;
            document.getElementById('s-img').value = "";
            document.getElementById('s-water').value = "";
            updateStageUI();
        } else {
            finishAndUpload();
        }
    }

    function updateStageUI() {
        document.getElementById('current-stage-title').innerText = `Nhập Giai Đoạn ${currentStageIndex} / ${totalStages}`;
        if(currentStageIndex === totalStages) {
            const btn = document.getElementById('btn-action');
            btn.innerText = "HOÀN TẤT & ĐƯA LÊN VƯỜN";
            btn.className = "btn btn-finish";
        }
    }

    async function finishAndUpload() {
        try {
            await db.ref('settings/plants_v2').push({
                name: tempName,
                stages: gatheredStages,
                createdAt: Date.now()
            });
            alert("Chúc mừng Duy! Cây " + tempName + " đã chính thức lên vườn.");
            location.reload();
        } catch (e) { alert("Lỗi rồi: " + e.message); }
    }

    // Load danh sách tổng
    function loadTable() {
        db.ref('settings/plants_v2').on('value', s => {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = "";
            if(!s.exists()) return;
            
            s.forEach(child => {
                const data = child.val();
                // Chỉ lấy các cây có đủ dữ liệu stages
                if (data.stages && data.stages.length > 0) {
                    const lastStage = data.stages[data.stages.length - 1];
                    // Chuyển link drive thành link trực tiếp để hiện ảnh
                    const imgUrl = getDirectLink(lastStage.image);

                    const row = `
                        <tr>
                            <td><b>${data.name}</b></td>
                            <td>${data.stages.length}</td>
                            <td>${imgUrl.includes('http') ? `<img src="${imgUrl}" class="img-preview" onerror="this.src='https://cdn-icons-png.flaticon.com/512/628/628283.png'">` : lastStage.image}</td>
                            <td><button onclick="deletePlant('${child.key}')" style="color:red; border:none; background:none; cursor:pointer;">Xóa</button></td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                }
            });
        });
    }

    async function deletePlant(id) {
        if(confirm("Duy có chắc muốn xóa cây này khỏi danh sách không?")) {
            await db.ref('settings/plants_v2/' + id).remove();
        }
    }

    loadTable();
</script>

</body>
</html>
