<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantrees - Đi bộ kiếm xu</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2e7d32; --danger: #d32f2f; --bg: #f1f8e9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { font-family: 'Luckiest Guy'; color: var(--primary); font-size: 28px; margin-bottom: 10px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }
        .stat-card { background: #f9f9f9; padding: 15px; border-radius: 15px; border-bottom: 4px solid #ddd; }
        .stat-value { font-family: 'Luckiest Guy'; font-size: 30px; color: #333; }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; }
        
        #status { font-size: 14px; color: #666; font-style: italic; margin: 15px 0; min-height: 40px; }
        
        .controls { display: flex; flex-direction: column; gap: 10px; }
        .btn-control {
            background: var(--primary); color: white; border: none; padding: 15px;
            border-radius: 50px; font-family: 'Luckiest Guy'; font-size: 18px;
            cursor: pointer; box-shadow: 0 5px 0 #1b5e20; width: 100%;
            transition: 0.2s;
        }
        .btn-stop { background: var(--danger); box-shadow: 0 5px 0 #b71c1c; }
        .btn-control:disabled { background: #ccc !important; box-shadow: none !important; cursor: default; }
        .btn-control:active { transform: translateY(2px); box-shadow: 0 2px 0 #1b5e20; }
        
        .locked { color: var(--danger); font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏃 CHẾ ĐỘ VẬN ĐỘNG</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="display-dist">0</div>
                <div class="stat-label">Quãng đường (m)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="display-coins" style="color: #fbc02d;">0</div>
                <div class="stat-label">Xu tích lũy</div>
            </div>
        </div>

        <p id="status">Sẵn sàng nhận diện di chuyển...</p>

        <div class="controls">
            <button id="btn-start" class="btn-control" onclick="startTracking()">BẮT ĐẦU THEO DÕI</button>
            <button id="btn-stop" class="btn-control btn-stop" style="display: none;" onclick="confirmStop()">DỪNG LẠI & KẾT THÚC</button>
            <button id="btn-back" class="btn-control" style="background: #888; box-shadow: 0 5px 0 #666;" onclick="location.href='tasks.html'">QUAY LẠI</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAASOFywyAkx2G7ubR_XsODI1U2x7mSMpE",
            authDomain: "plantrees-b1d99.firebaseapp.com",
            databaseURL: "https://plantrees-b1d99-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "plantrees-b1d99",
            storageBucket: "plantrees-b1d99.firebasestorage.app",
            messagingSenderId: "208821406000",
            appId: "1:208821406000:web:b4fac89c9a2f65d739e0f5"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let watchID = null;
        let lastCoords = null;
        let totalDistance = 0;
        let sessionCoins = 0;
        const MAX_SPEED_MPS = 8; 

        function startTracking() {
            if (!navigator.geolocation) return alert("Thiết bị không hỗ trợ GPS!");
            
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-back').style.display = 'none';
            document.getElementById('btn-stop').style.display = 'block';
            document.getElementById('status').innerText = "Đang kết nối vệ tinh...";

            watchID = navigator.geolocation.watchPosition(updatePosition, handleError, {
                enableHighAccuracy: true,
                maximumAge: 0
            });
        }

        // HÀM XÁC NHẬN KHI BẤM DỪNG
        function confirmStop() {
            const roundedDist = Math.floor(totalDistance);
            const userConfirmed = confirm(`BẠN MUỐN DỪNG LẠI?\n\n- Quãng đường: ${roundedDist}m\n- Xu nhận được: ${sessionCoins} xu\n\nNhấn OK để kết thúc và lưu kết quả.`);
            
            if (userConfirmed) {
                if (watchID) navigator.geolocation.clearWatch(watchID);
                location.href = 'tasks.html';
            }
        }

        async function updatePosition(position) {
            const { latitude, longitude, speed } = position.coords;
            const statusEl = document.getElementById('status');

            if (speed > MAX_SPEED_MPS) {
                lockTask("PHÁT HIỆN GIAN LẬN: Vận tốc quá nhanh!");
                return;
            }

            if (lastCoords) {
                const dist = calculateDistance(lastCoords.latitude, lastCoords.longitude, latitude, longitude);

                if (dist >= 2) {
                    totalDistance += dist;
                    const newCoins = Math.floor(dist / 2);
                    if (newCoins > 0) {
                        sessionCoins += newCoins;
                        await updateFirebaseCoins(newCoins);
                    }
                    updateUI();
                }
            }
            lastCoords = { latitude, longitude };
            statusEl.innerText = "Hệ thống đang hoạt động ổn định...";
        }

        async function updateFirebaseCoins(amount) {
            const user = auth.currentUser;
            if (user) {
                await db.ref(`users/${user.uid}/coins`).set(firebase.database.ServerValue.increment(amount));
            }
        }

        function updateUI() {
            document.getElementById('display-dist').innerText = Math.floor(totalDistance);
            document.getElementById('display-coins').innerText = sessionCoins;
        }

        function lockTask(msg) {
            if (watchID) navigator.geolocation.clearWatch(watchID);
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `<span class="locked">${msg}</span>`;
            document.getElementById('btn-stop').disabled = true;
            alert(msg);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                       предельно Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function handleError(error) {
            document.getElementById('status').innerText = "Lỗi GPS. Hãy kiểm tra cài đặt vị trí!";
            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-stop').style.display = 'none';
        }
    </script>
</body>
</html>
